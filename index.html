<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DueSoon - never miss a deadline</title>
<meta name="description" content="A private deadline tracker for students. Add deadlines, see live countdowns, and know what to do next. No login, data stays on your device.">
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#1f1b16;--muted:#7a7066;--line:#e8dfd2;--accent:#e8512f;--accent-soft:#fde6df;--ok:#2f8f5b;--warn:#c98a00;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:30px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0}
.next{margin:22px 0;padding:22px;border-radius:var(--r);background:var(--ink);color:#fff}
.next small{opacity:.6;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.next h2{margin:6px 0 2px;font-size:24px}
.next .big{font-size:40px;font-weight:800;color:#ffb199;letter-spacing:-.02em}
.next.empty{background:var(--card);color:var(--muted);border:1px dashed var(--line)}
form{display:grid;grid-template-columns:2fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
form .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,button{font:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
h3{margin:26px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h3.over{color:var(--accent)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
li.done .t{text-decoration:line-through;color:var(--muted)}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.t{font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.grow{flex:1;min-width:0}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.soon{background:#fff3d1;color:var(--warn)}
.badge.later{background:#e8f4ed;color:var(--ok)}
.badge.dn{background:#eee;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 8px}
.del:hover{color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin-top:22px}
#status{min-height:1.2em;color:var(--muted);font-size:13px;margin-top:8px}
footer{margin-top:40px;color:var(--muted);font-size:13px}
@media(max-width:520px){form{grid-template-columns:1fr}.next .big{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Due<span>Soon</span></h1><p class="sub">Know what is due, and what to do next.</p></div>
</header>

<section id="next" class="next empty" aria-live="polite"></section>

<form id="form" autocomplete="off">
  <div><label for="title">What is due?</label><input id="title" required maxlength="80" placeholder="Physics lab report"></div>
  <div><label for="subject">Subject</label><input id="subject" maxlength="30" placeholder="Physics"></div>
  <div><label for="due">Due on</label><input id="due" type="datetime-local" required></div>
  <div><label for="prio">Priority</label><select id="prio"><option value="1">Normal</option><option value="2">High</option></select></div>
  <div class="full"><button class="btn" type="submit">Add deadline</button></div>
</form>
<div id="status" role="status" aria-live="polite"></div>

<div class="row" id="filters" role="group" aria-label="Filter"></div>
<div id="lists"></div>

<div class="row">
  <button class="btn ghost" id="export" type="button">Export backup</button>
  <button class="btn ghost" id="import" type="button">Import backup</button>
  <button class="btn ghost" id="clear" type="button">Clear done</button>
  <input id="file" type="file" accept="application/json" hidden>
</div>
<p class="hint">Tip: press / to jump to the title box. Everything is saved on this device only.</p>
<footer>DueSoon &middot; a small app by Kanishk Saini &middot; No account, no tracking</footer>
</div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
